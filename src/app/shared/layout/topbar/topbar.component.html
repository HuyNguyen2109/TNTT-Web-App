<p-toolbar class="topbar-bar">
  <ng-template pTemplate="end">
    <div class="flex items-center gap-3">
      <p-avatar
        [label]="userInitial()"
        shape="circle"
      />
      <span class="text-sm text-[var(--p-text-color)]">{{ auth.currentUser()?.displayName }}</span>
      <p-button
        icon="pi pi-sign-out"
        [text]="true"
        severity="secondary"
        [pTooltip]="'NAV.LOGOUT' | translate"
        (onClick)="auth.logout()"
      />
    </div>
  </ng-template>
</p-toolbar>
