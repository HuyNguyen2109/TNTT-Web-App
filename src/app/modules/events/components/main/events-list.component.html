<p-toolbar styleClass="page-toolbar">
  <ng-template pTemplate="start">
    <h2 class="m-0 text-xl font-semibold">{{ 'EVENTS.TITLE' | translate }}</h2>
  </ng-template>
  <ng-template pTemplate="end">
    <p-iconfield>
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        [placeholder]="'COMMON.SEARCH' | translate"
        (input)="onSearch($event)"
      />
    </p-iconfield>
    <p-button
      icon="pi pi-plus"
      [label]="'EVENTS.ADD_NEW' | translate"
      severity="success"
      styleClass="ml-2"
    />
  </ng-template>
</p-toolbar>

@if (service.loading()) {
  <div class="p-4">
    <p-skeleton width="100%" height="3rem" styleClass="mb-2" />
    <p-skeleton width="100%" height="3rem" styleClass="mb-2" />
    <p-skeleton width="100%" height="3rem" styleClass="mb-2" />
    <p-skeleton width="100%" height="3rem" styleClass="mb-2" />
    <p-skeleton width="100%" height="3rem" />
  </div>
} @else {
  <p-table
    #tableRef
    [value]="service.events()"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    styleClass="p-datatable-gridlines p-datatable-striped p-datatable-sm"
    [globalFilterFields]="['eventName','description']"
    [rowHover]="true"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="eventName">
          {{ 'EVENTS.NAME' | translate }}
          <p-sortIcon field="eventName" />
        </th>
        <th>{{ 'EVENTS.DATE' | translate }}</th>
        <th>{{ 'EVENTS.DESCRIPTION' | translate }}</th>
        <th style="width: 6rem"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-event>
      <tr>
        <td>{{ event.eventName }}</td>
        <td>{{ event.date }}</td>
        <td>{{ event.description }}</td>
        <td>
          <p-button icon="pi pi-pencil" [text]="true" severity="info" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (click)="confirmDelete($event, event, 'eventName')" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center">{{ 'COMMON.NO_DATA' | translate }}</td>
      </tr>
    </ng-template>
  </p-table>
}
<p-confirmpopup />
<p-toast />
